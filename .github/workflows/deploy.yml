# Met EGGVERSE en ligne sur GitHub Pages à chaque mise à jour.
# Étapes : installation, tests, construction du jeu, puis publication sur la branche « gh-pages ».
# Réglage à faire UNE fois : Settings → Pages → Source « Deploy from a branch » → gh-pages / (root).
name: Mise en ligne du jeu

on:
  push:
    branches: [claude/eggverse-game-development-p0py91, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publication sur gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mise en ligne de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
